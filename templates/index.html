<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Currency Converter</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background: linear-gradient(135deg,#201930,#6B2EFF,#1A1333);
font-family: system-ui;
}
.convert-btn{
height:52px;
border-radius:12px;
font-size:18px;
background:#201930;
color:white;
border:none;
}

.convert-btn:hover{
background:#2c2450;
}

.converter-card{
max-width:520px;
width:100%;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.amount-input{
height:55px;
font-size:20px;
border-radius:12px;
}

.currency-box{
border:1px solid #e9ecef;
border-radius:12px;
padding:12px;
background:#fff;
}

.swap-btn{
width:45px;
height:45px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

.result-box{
background:#ecfdf5;
border-radius:12px;
padding:18px;
}

.convert-btn{
height:52px;
border-radius:12px;
font-size:18px;
}

.rate-card{
border-radius:14px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.flag{
font-size:20px;
}

</style>
</head>

<body>

<div class="container py-5">

<div class="card converter-card mx-auto p-4">

<h3 class="text-center fw-bold mb-4">
⚡ Currency Converter
</h3>

<form method="POST">

<div class="mb-3">
<label class="form-label fw-semibold">Amount</label>
<input type="number" name="amount" class="form-control amount-input" value="1" required>
</div>

<div class="row align-items-center g-2 mb-4">

<div class="col-5">
<select class="form-select" name="from_currency">

{% for currency in currency_list %}

<option value="{{ currency }}"
{% if currency == from_currency %} selected {% endif %}>
{{ currency }}
</option>

{% endfor %}

</select>
</div>

<div class="col-2 text-center">
<i class="bi bi-arrow-left-right"></i>
</div>

<div class="col-5">
<select class="form-select" name="to_currency">

{% for currency in currency_list %}

<option value="{{ currency }}"
{% if currency == to_currency %} selected {% endif %}>
{{ currency }}
</option>

{% endfor %}

</select>
</div>

</div>

<button type="submit" class="btn btn-success convert-btn:hover convert-btn w-100 mb-4">
Convert Now
</button>

</form>

{% if result %}

<div class="result-box text-center mb-4">

<div class="text-muted small mb-2">
1 {{ from_currency }} = {{ rate }} {{ to_currency }}
</div>

<h2 class="fw-bold mb-0">
{{ result }} {{ to_currency }}
</h2>

</div>

{% endif %}

<!-- LIVE RATES -->
<div class="row g-3">

{% for currency, value in top_rates.items() %}

<div class="col-6 col-md-3">
<div class="card rate-card p-3 text-center">

<div class="fw-semibold">
USD / {{ currency }}
</div>

<div class="small text-muted">
{{ value }}
</div>

</div>
</div>

{% endfor %}

</div>

</div>

</div>

</body>
</html>
